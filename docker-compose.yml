# Local development stack. Phase 0 ships the database only; backend and
# frontend services are added in phase 8 (run them natively until then).
services:
  db:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "5433:5432" # host 5433 avoids clashing with a locally installed Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
