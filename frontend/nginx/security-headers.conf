# Included by every location that serves the app (nginx drops server-level
# add_header directives inside a location that has its own, so they live here).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Scripts only from this origin. Inline styles are needed by UI components
# (positioning of popovers). Images: own origin, logo previews (blob:) and
# presigned S3 URLs. API calls go to this origin only.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.amazonaws.com; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
