# One public origin: nginx serves the built React app and forwards API/admin
# requests to gunicorn, so the browser never makes cross-origin calls.

# Keep the original scheme when a TLS-terminating load balancer sits in front.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Logos are limited to 2 MB by the API; leave room for multipart overhead.
    client_max_body_size 5m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Look the backend up through Docker's DNS on each request (cached 10 s), so nginx
    # starts even if the backend isn't up yet and follows it when it restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    # Django: the API, the admin and the admin's static files (served by WhiteNoise).
    location ~ ^/(api|admin|static)/ {
        proxy_pass $backend;
        # $http_host keeps the port (e.g. localhost:8080), so absolute URLs the API
        # builds, like local logo URLs, point back here. Django checks it against ALLOWED_HOSTS.
        proxy_set_header Host $http_host;
        # nginx appends the client IP; the API trusts exactly one proxy
        # (TRUSTED_PROXY_COUNT=1) when reading it for rate limiting.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 30s;
    }

    # Logos stored on local disk (USE_S3=False only; with S3 the URLs point at the bucket).
    # Uploads are validated images, and this CSP stops a file from running as a page.
    location /media/ {
        alias /srv/media/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        expires 1h;
    }

    # Vite's bundles have content hashes in their names, so they can be cached forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Single-page app: unknown paths render index.html and React Router takes over.
    # Never cache it, so a new deploy is picked up on the next load.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
